name: bible_parser_flutter
description: "A Flutter package for parsing Bible texts in OSIS, USFX, and ZEFANIA formats with direct parsing and database-backed approaches. Includes desktop app for database creation and management."
version: 0.3.0
homepage: https://github.com/Omarzintan/bible_parser_flutter
repository: https://github.com/Omarzintan/bible_parser_flutter
issue_tracker: https://github.com/Omarzintan/bible_parser_flutter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  xml: ^6.3.0
  sqflite: ^2.3.0
  path: ^1.8.3
  sqflite_common_ffi: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^2.0.0
  test: ^1.24.0
